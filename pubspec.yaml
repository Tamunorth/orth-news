name: orth_news
description: "Orth News — a monochrome news reader (NewsAPI)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.8

  # Networking
  dio: ^5.9.2

  # Routing
  go_router: ^17.3.0

  # Functional error handling
  fpdart: ^1.2.0

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8

  # Utils
  stream_transform: ^2.1.1
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true
