name: orth_news
description: "Orth News — a monochrome news reader (NewsAPI)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # l10n delegates for the generated AppLocalizations
    sdk: flutter

  # State management
  bloc: ^9.2.1 # core BLoC primitives (Bloc, Emitter)
  flutter_bloc: ^9.1.1 # BlocProvider / BlocBuilder / RepositoryProvider widgets
  hydrated_bloc: ^11.0.0 # persists Bookmarks + Settings to disk across restarts
  bloc_concurrency: ^0.3.0 # restartable/droppable event transformers
  equatable: ^2.0.8 # value equality for entities, states and events

  # Networking
  dio: ^5.9.2 # HTTP client for NewsAPI + the API-key interceptor

  # Routing
  go_router: ^17.3.0 # declarative routing + StatefulShell bottom-nav

  # Functional error handling
  fpdart: ^1.2.0 # Either<Failure, T> at the repository boundary

  # UI
  cached_network_image: ^3.4.1 # article thumbnails/images with disk caching
  google_fonts: ^8.1.0 # Outfit + Poppins typography

  # Utils
  stream_transform: ^2.1.1 # debounce for the search query stream
  intl: ^0.20.2 # date formatting + l10n message formatting
  path_provider: ^2.1.5 # docs directory for HydratedBloc storage
  url_launcher: ^6.3.2 # open the original article URL in the browser

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0 # blocTest harness for bloc unit tests
  mocktail: ^1.0.5 # mocks for repos / use-cases / storage in tests
  very_good_analysis: ^10.1.0 # lint ruleset (included in analysis_options.yaml)
  flutter_native_splash: ^2.4.7 # splash generator, CLI (flutter_native_splash.yaml)

flutter:
  uses-material-design: true
  generate: true
